# NightQA, containerized.
#
#   docker compose up --build            dashboard on http://localhost:3300 and the demo shop (10 seeded bugs)
#                                        Ports listen on 127.0.0.1 only. Set NIGHTQA_BIND=0.0.0.0 to share them, and turn on sign-in first.
#   docker compose --profile cli run --rm runner run --url http://zoo:4010 --flow flows/checkout.yaml --allow-private-network
#   docker compose --profile cli run --rm runner replay --url http://zoo:4010 --test tests/nightqa --allow-private-network
#
# Settings come from .env (copy .env.example). Evidence lands in ./results, saved tests in ./tests/nightqa.
# Files in ./results and ./tests/nightqa are owned by you: set NIGHTQA_UID=$(id -u) and NIGHTQA_GID=$(id -g) in .env
# (default 1000). Extra hardening (no-new-privileges): docker compose -f docker-compose.yml -f docker-compose.hardened.yml up

name: nightqa

x-nightqa: &nightqa
  image: nightqa:local
  build:
    context: .
    dockerfile: Dockerfile
  init: true # reap Chromium child processes
  ipc: host # Chromium shared memory; avoids crashes on heavy pages
  user: '${NIGHTQA_UID:-1000}:${NIGHTQA_GID:-1000}'
  cap_drop: [ALL]
  restart: unless-stopped

services:
  zoo:
    <<: *nightqa
    command: ['node', 'dist/zoo/server.js']
    working_dir: /app
    environment:
      ZOO_PORT: '4010'
      ZOO_HOST: 0.0.0.0
      ZOO_BUGS: ${ZOO_BUGS:-all}
      ZOO_TEST_USER: ${ZOO_TEST_USER:-test-buyer@example.com}
      ZOO_TEST_PASSWORD: ${ZOO_TEST_PASSWORD:-zoo-pass}
    ports:
      - '${NIGHTQA_BIND:-127.0.0.1}:${NIGHTQA_ZOO_PORT:-4010}:4010'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4010/products').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Run and bug metadata (ADR 0008). Evidence files stay in ./results. Not published to the host.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nightqa
      POSTGRES_USER: nightqa
      # Set a real password in .env (POSTGRES_PASSWORD). The default is only for a first local try.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nightqa-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nightqa -d nightqa']
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates or updates the database tables before the app starts (ADR 0008). Safe to run again.
  migrate:
    <<: *nightqa
    restart: 'no'
    working_dir: /app
    entrypoint: ['node', 'dist/src/cli.js', 'db', 'migrate']
    environment:
      DATABASE_URL: postgres://nightqa:${POSTGRES_PASSWORD:-nightqa-local-only}@postgres:5432/nightqa
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *nightqa
    env_file:
      - path: .env
        required: false
    environment:
      # The app under test. "zoo" is a private name, so the engine needs the explicit consent below.
      NIGHTQA_TARGET_URL: ${NIGHTQA_TARGET_URL:-http://zoo:4010}
      NIGHTQA_ALLOW_PRIVATE_NETWORK: ${NIGHTQA_ALLOW_PRIVATE_NETWORK:-1}
      # Set here, not left to .env: the dashboard must listen on 3000 inside the container.
      PORT: '3000'
      # Sign-in. The dashboard serves nothing until GitHub sign-in is configured in .env (or NIGHTQA_AUTH=off, dev only).
      NIGHTQA_AUTH: ${NIGHTQA_AUTH:-}
      NIGHTQA_PUBLIC_URL: ${NIGHTQA_PUBLIC_URL:-http://localhost:3300}
      NIGHTQA_DATA_DIR: /app/data
      # Times in the dashboard are shown in this timezone (the container itself runs in UTC).
      TZ: ${NIGHTQA_TZ:-Asia/Kolkata}
      DATABASE_URL: postgres://nightqa:${POSTGRES_PASSWORD:-nightqa-local-only}@postgres:5432/nightqa
    ports:
      - '${NIGHTQA_BIND:-127.0.0.1}:${NIGHTQA_WEB_PORT:-3300}:3000'
    volumes:
      - ./results:/app/results
      - ./tests/nightqa:/app/tests/nightqa
      # Writable: the flow editor and Excel import save flows here.
      - ./flows:/app/flows
      # Settings, encrypted secrets and the audit log. Keep this volume.
      - ./data:/app/data
    depends_on:
      zoo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # One-off engine runs: docker compose --profile cli run --rm runner <run|replay> ...
  runner:
    <<: *nightqa
    profiles: ['cli']
    restart: 'no'
    working_dir: /app
    entrypoint: ['node', 'dist/src/cli.js']
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://nightqa:${POSTGRES_PASSWORD:-nightqa-local-only}@postgres:5432/nightqa
      TZ: ${NIGHTQA_TZ:-Asia/Kolkata}
    volumes:
      - ./results:/app/results
      - ./tests/nightqa:/app/tests/nightqa
      - ./flows:/app/flows:ro
    depends_on:
      zoo:
        condition: service_healthy

volumes:
  pgdata:
