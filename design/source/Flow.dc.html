<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NightQA User flow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 1800px; height: 1180px; box-sizing: border-box; padding: 56px 64px; overflow: hidden; font-family: 'Manrope', system-ui, sans-serif; color: #EAF0FA; background: radial-gradient(1000px 520px at 15% -100px, rgba(52,227,203,0.17), transparent 62%), radial-gradient(900px 520px at 95% 100%, rgba(139,124,255,0.14), transparent 62%), #070A10; display: flex; flex-direction: column; gap: 30px">

<header style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px">
<div>
<div style="font-size: 12.5px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; color: {{accent}}">User flow</div>
<h1 style="margin: 8px 0 0; font-size: 46px; line-height: 1.05; font-weight: 800; letter-spacing: -1.8px">From signup to a merged fix</h1>
</div>
<div style="font-size: 15px; color: #A3AEC2; max-width: 460px; line-height: 1.5; text-align: right">Web and mobile follow the same five steps. Click any screen to open it.</div>
</header>

<div style="display: flex; align-items: center; gap: 0">
<div style="flex: 0 0 120px"></div>
<sc-for list="{{heads}}" as="h" hint-placeholder-count="5">
<div style="flex: 1; min-width: 0"><div style="display: flex; align-items: center; gap: 12px"><span style="width: 32px; height: 32px; border-radius: 50%; background: {{accent}}; color: #03211D; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; box-shadow: 0 0 22px rgba(52,227,203,0.6)">{{h.n}}</span><span style="font-size: 16px; font-weight: 800; letter-spacing: -0.3px">{{h.label}}</span></div></div>
<div style="{{h.gap}}"></div>
</sc-for>
</div>

<section style="display: flex; flex-direction: column; gap: 22px">
<sc-for list="{{lanes}}" as="lane" hint-placeholder-count="2">
<div style="display: flex; align-items: stretch; gap: 0">
<div style="flex: 0 0 120px; display: flex; align-items: center"><span style="font-size: 13px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: #EAF0FA; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); padding: 9px 16px; border-radius: 99px">{{lane.name}}</span></div>
<sc-for list="{{lane.items}}" as="s" hint-placeholder-count="5">
<a href="{{s.href}}" style="{{s.card}}">
<div style="{{s.thumb}}"><span style="{{s.bar1}}"></span><span style="{{s.bar2}}"></span><span style="{{s.dot}}"></span></div>
<div style="min-width: 0"><div style="font-size: 17px; font-weight: 800; letter-spacing: -0.3px">{{s.name}}</div><div style="font-size: 12.5px; color: #B4BFD2; margin-top: 5px; line-height: 1.45">{{s.note}}</div></div>
</a>
<div style="{{s.arrow}}"><span style="{{s.line}}"></span><span style="{{s.head}}"></span></div>
</sc-for>
</div>
</sc-for>
</section>

<div style="display: flex; align-items: center; gap: 0">
<div style="flex: 0 0 120px"></div>
<div style="flex: 1; display: flex; align-items: center; gap: 14px; padding-left: 8px"><span style="font-size: 13px; color: #8E9BB2">Every night the loop repeats</span><span style="flex: 1; height: 2px; background: linear-gradient(90deg, rgba(255,255,255,0.05), {{accent}}); box-shadow: 0 0 12px rgba(52,227,203,0.5)"></span><span style="font-size: 12.5px; font-weight: 800; color: {{accent}}">Back to step 2</span></div>
</div>

<section style="padding: 20px 24px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.09); background: rgba(255,255,255,0.03)">
<div style="font-size: 13px; font-weight: 800; color: #A3AEC2; margin-bottom: 12px">Anytime, from the top bar or settings</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{side}}" as="x" hint-placeholder-count="7"><a href="{{x.href}}" style="min-height: 44px; box-sizing: border-box; padding: 0 18px; display: inline-flex; align-items: center; border-radius: 99px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); font-size: 13.5px; font-weight: 700">{{x.label}}</a></sc-for>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#34E3CB","options":["#34E3CB","#6AA6FF","#8B7CFF","#FFC14D"]},"$preview":{"width":1800,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#34E3CB';
    const CORAL = '#FF6B5B', BLUE = '#6AA6FF', AMBER = '#FFC14D', VIOLET = '#8B7CFF';
    const arrowBox = 'flex:0 0 56px;display:flex;align-items:center;justify-content:center';
    const line = 'width:30px;height:2px;background:' + accent + ';box-shadow:0 0 10px rgba(52,227,203,0.6)';
    const head = 'width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid ' + accent;
    const heads = [
      { n: '1', label: 'Get started' }, { n: '2', label: 'Read the report' }, { n: '3', label: 'Understand the bug' },
      { n: '4', label: 'Review the fix' }, { n: '5', label: 'Merge and learn' }
    ].map((h, i) => ({ ...h, gap: 'flex:0 0 56px' }));
    const mk = (mobile) => (items) => items.map(([name, note, href, c], i) => ({
      name, note, href,
      card: 'flex:1;min-width:0;display:flex;gap:16px;align-items:center;padding:18px 20px;border-radius:22px;border:1px solid ' + c + '55;background:linear-gradient(180deg,' + c + '18,rgba(255,255,255,0.012));box-shadow:0 0 50px -22px ' + c + '99,inset 0 1px 0 rgba(255,255,255,0.08)',
      thumb: mobile
        ? 'flex:0 0 58px;height:108px;border-radius:14px;border:1.5px solid ' + c + ';background:#0B1019;padding:9px 8px;box-sizing:border-box;display:flex;flex-direction:column;gap:7px;position:relative'
        : 'flex:0 0 108px;height:78px;border-radius:12px;border:1.5px solid ' + c + ';background:#0B1019;padding:10px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;position:relative',
      bar1: 'height:7px;border-radius:4px;width:70%;background:rgba(255,255,255,0.28)',
      bar2: 'height:7px;border-radius:4px;width:45%;background:rgba(255,255,255,0.14)',
      dot: 'position:absolute;right:9px;bottom:9px;width:' + (mobile ? 14 : 18) + 'px;height:' + (mobile ? 14 : 18) + 'px;border-radius:50%;background:' + c + ';box-shadow:0 0 14px ' + c,
      arrow: i === items.length - 1 ? 'flex:0 0 56px' : arrowBox,
      line: i === items.length - 1 ? 'display:none' : line,
      head: i === items.length - 1 ? 'display:none' : head
    }));
    const lanes = [
      { name: 'Web', items: mk(false)([
        ['Setup', 'Start free from the landing page. Six steps, about 30 minutes.', 'Setup.dc.html', BLUE],
        ['Overview', 'The night in one view: what was found and what needs you.', 'Main.dc.html', accent],
        ['Bugs and Run', 'Open a bug, watch the replay, see the evidence.', 'Bugs.dc.html', CORAL],
        ['Bug and fix PR', 'Failing test, risk gauge and verification report.', 'Bug.dc.html', AMBER],
        ['Autonomy', 'Merged fixes become nightly tests. Unlock auto-merge when trusted.', 'Autonomy.dc.html', VIOLET]
      ]) },
      { name: 'Mobile', items: mk(true)([
        ['Setup', 'The same six steps from your phone.', 'MSetup.dc.html', BLUE],
        ['Morning report', 'Night timeline and the one fix waiting for you.', 'MHome.dc.html', accent],
        ['Bugs and Run', 'Bug list, then the replay of what broke.', 'MBugs.dc.html', CORAL],
        ['Review a fix PR', 'Verification report and one-tap approve.', 'MBug.dc.html', AMBER],
        ['Alerts', 'Critical alerts and “PR merged, test added”.', 'MAlerts.dc.html', VIOLET]
      ]) }
    ];
    const side = [
      { label: 'Landing page', href: 'Landing.dc.html' }, { label: 'Flows and editor', href: 'Flows.dc.html' }, { label: 'Import from Excel', href: 'Import.dc.html' },
      { label: 'Exploration', href: 'Explore.dc.html' }, { label: 'Profiles', href: 'Profiles.dc.html' }, { label: 'Settings', href: 'Settings.dc.html' },
      { label: 'Usage and billing', href: 'Billing.dc.html' }, { label: 'Notifications', href: 'Reports.dc.html' }
    ];
    return { accent, heads, lanes, side };
  }
}
</script>
</body>
</html>
