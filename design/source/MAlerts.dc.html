<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NightQA Mobile alerts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; font-family: 'Manrope', system-ui, sans-serif; color: #EAF0FA; background: radial-gradient(460px 340px at 50% -80px, rgba(255,107,91,0.26), transparent 65%), radial-gradient(380px 300px at 100% 70%, rgba(52,227,203,0.10), transparent 65%), #070A10">

<header style="padding: 26px 20px 8px">
<div style="font-size: 11.5px; letter-spacing: 1.3px; text-transform: uppercase; font-weight: 800; color: {{accent}}">Alerts</div>
<h1 style="margin: 6px 0 0; font-size: 30px; font-weight: 800; letter-spacing: -1.1px">What needs you now</h1>
</header>

<main style="flex: 1; min-height: 0; padding: 12px 20px 0; display: flex; flex-direction: column; gap: 16px">

<a href="MBug.dc.html" style="display: block; padding: 20px 20px 18px; border-radius: 26px; border: 1px solid rgba(255,107,91,0.65); background: linear-gradient(180deg, rgba(255,107,91,0.22), rgba(255,107,91,0.05)); box-shadow: 0 0 70px -16px rgba(255,107,91,0.75), inset 0 1px 0 rgba(255,255,255,0.12)">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 12px; font-weight: 800; color: #FFFFFF; background: #FF6B5B; padding: 5px 12px; border-radius: 99px; box-shadow: 0 0 22px rgba(255,107,91,0.8)">Critical</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #FFB4AA">Sent 6 min after it was confirmed</span></div>
<div style="font-size: 22px; font-weight: 800; letter-spacing: -0.6px; margin-top: 14px; line-height: 1.2">Payment cannot be completed on Slow 3G</div>
<div style="font-size: 13.5px; color: #FFCFC9; margin-top: 8px; line-height: 1.5">Checkout with card · reproduced 3 of 3 · failing test attached</div>
<div style="display: flex; gap: 10px; margin-top: 16px"><span style="flex: 1; min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #FFFFFF; color: #3A0D08; font-size: 14.5px; font-weight: 800">Open the bug</span><span style="min-height: 48px; padding: 0 18px; display: flex; align-items: center; border-radius: 14px; border: 1px solid rgba(255,255,255,0.4); font-size: 14.5px; font-weight: 700">Mute 1 h</span></div>
</a>

<section style="display: flex; flex-direction: column">
<div style="font-size: 15px; font-weight: 800; margin-bottom: 4px">Earlier</div>
<sc-for list="{{items}}" as="n" hint-placeholder-count="4">
<div style="display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-top: 1px solid rgba(255,255,255,0.08)"><span style="{{n.dot}}"></span><div style="flex: 1; min-width: 0"><div style="font-size: 14.5px; font-weight: 700; line-height: 1.3">{{n.title}}</div><div style="font-size: 12.5px; color: #8E9BB2; margin-top: 3px">{{n.time}}</div></div></div>
</sc-for>
</section>

<section style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.09); background: rgba(255,255,255,0.04)">
<div style="flex: 1"><div style="font-size: 14px; font-weight: 800">Quiet night</div><div style="font-size: 12.5px; color: #A3AEC2; margin-top: 3px; line-height: 1.4">Send a one-line “all clear” when nothing is found.</div></div>
<button role="switch" aria-checked="true" aria-label="Quiet night all clear" style="width: 56px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: flex-end"><span style="width: 52px; height: 30px; border-radius: 99px; background: {{accent}}; position: relative; display: block; box-shadow: 0 0 18px rgba(52,227,203,0.5)"><span style="position: absolute; right: 4px; top: 4px; width: 22px; height: 22px; border-radius: 50%; background: #03211D"></span></span></button>
</section>
</main>

<dc-import name="TabBar" active="Alerts" hint-placeholder="" hint-size="100%,96px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#34E3CB","options":["#34E3CB","#6AA6FF","#8B7CFF","#FFC14D"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#34E3CB';
    const dot = (c) => 'flex:0 0 10px;width:10px;height:10px;margin-top:5px;border-radius:50%;background:' + c + ';box-shadow:0 0 12px ' + c;
    const items = [
      { title: 'PR #143 verified: low risk, all checks passed', time: 'Today, 02:44', dot: dot(accent) },
      { title: 'Morning report sent to Slack and email', time: 'Today, 08:00', dot: dot('#FFFFFF') },
      { title: 'Refund request: test account is locked', time: 'Today, 03:30', dot: dot('#8B7CFF') },
      { title: 'Yesterday’s PR #138 was merged. Regression test added.', time: 'Wednesday', dot: dot('#6AA6FF') }
    ];
    return { accent, items };
  }
}
</script>
</body>
</html>
