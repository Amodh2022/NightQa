<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NightQA Mobile tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<nav aria-label="Tabs" style="box-sizing: border-box; width: 100%; padding: 8px 14px 22px; font-family: 'Manrope', system-ui, sans-serif">
<div style="display: flex; gap: 2px; padding: 6px; border-radius: 26px; border: 1px solid rgba(255,255,255,0.12); background: rgba(18,24,36,0.92); box-shadow: 0 18px 40px -12px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.08)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" style="{{t.style}}"><span style="{{t.glyph}}"></span><span style="font-size: 11.5px">{{t.label}}</span></a>
</sc-for>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#34E3CB","options":["#34E3CB","#6AA6FF","#8B7CFF","#FFC14D"]},"active":{"editor":"text","default":"Home"},"$preview":{"width":390,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#34E3CB';
    const active = this.props.active ?? 'Home';
    const items = [
      { label: 'Home', href: 'MHome.dc.html', shape: 'border-radius:50%' },
      { label: 'Bugs', href: 'MBugs.dc.html', shape: 'border-radius:4px;transform:rotate(45deg)' },
      { label: 'Runs', href: 'MRun.dc.html', shape: 'border-radius:2px;height:4px;width:18px' },
      { label: 'Alerts', href: 'MAlerts.dc.html', shape: 'border-radius:8px 8px 3px 3px' },
      { label: 'Setup', href: 'MSetup.dc.html', shape: 'border-radius:3px' }
    ];
    const tabs = items.map((t) => {
      const on = t.label === active;
      return {
        ...t,
        style: 'flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:20px;font-weight:' + (on ? '800' : '600') + ';color:' + (on ? '#FFFFFF' : '#8E9BB2') + ';background:' + (on ? 'rgba(255,255,255,0.1)' : 'transparent'),
        glyph: 'display:block;box-sizing:border-box;width:14px;height:14px;border:2px solid ' + (on ? accent : '#6F7C94') + ';' + t.shape + (on ? ';box-shadow:0 0 12px ' + accent : '')
      };
    });
    return { accent, tabs };
  }
}
</script>
</body>
</html>
