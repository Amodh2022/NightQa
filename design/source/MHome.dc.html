<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NightQA Mobile morning report</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; font-family: 'Manrope', system-ui, sans-serif; color: #EAF0FA; background: radial-gradient(420px 320px at 90% -60px, rgba(52,227,203,0.22), transparent 65%), radial-gradient(380px 300px at 0% 30%, rgba(139,124,255,0.12), transparent 65%), #070A10">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 6px">
<div style="display: flex; align-items: center; gap: 10px"><div style="width: 28px; height: 28px; border-radius: 50%; background: {{accent}}; position: relative; overflow: hidden; box-shadow: 0 0 22px rgba(52,227,203,0.6)"><div style="position: absolute; left: 11px; top: -4px; width: 26px; height: 26px; border-radius: 50%; background: #070A10"></div></div><span style="font-size: 18px; font-weight: 800; letter-spacing: -0.4px">NightQA</span></div>
<div style="display: flex; align-items: center; gap: 8px; min-height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05)"><span style="font-size: 13.5px; font-weight: 700">ShopKart</span><span style="font-size: 11px; font-weight: 800; color: #7FB0FF; background: rgba(106,166,255,0.16); padding: 2px 8px; border-radius: 99px">Staging</span></div>
</header>

<main style="flex: 1; min-height: 0; padding: 14px 20px 0; display: flex; flex-direction: column; gap: 18px">

<section style="position: relative; overflow: hidden; padding: 22px 20px 18px; border-radius: 26px; border: 1px solid rgba(255,255,255,0.1); background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 30px 60px -30px rgba(0,0,0,0.9)">
<div style="position: absolute; right: -50px; top: -60px; width: 190px; height: 190px; border-radius: 50%; background: radial-gradient(circle at 34% 32%, #E9FFFB 0%, {{accent}} 40%, #0C6F63 80%); box-shadow: 0 0 80px 14px rgba(52,227,203,0.3); opacity: 0.9"></div>
<div style="position: relative">
<div style="font-size: 11.5px; letter-spacing: 1.3px; text-transform: uppercase; font-weight: 800; color: {{accent}}">Thu 22 Oct · 8:00 AM</div>
<h1 style="margin: 10px 0 0; font-size: 32px; line-height: 1.05; font-weight: 800; letter-spacing: -1.2px; max-width: 230px">2 bugs proven.<br><span style="color: {{accent}}">1 fix waiting.</span></h1>
<div style="font-size: 13.5px; color: #B4BFD2; margin-top: 10px; line-height: 1.45">14 of 16 flows passed.</div>
</div>
<div style="position: relative; margin-top: 18px; height: 22px"><div style="position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: rgba(255,255,255,0.16)"></div>
<sc-for list="{{pins}}" as="p" hint-placeholder-count="4"><div style="{{p.style}}"></div></sc-for></div>
<div style="display: flex; align-items: flex-end; gap: 2px; height: 30px; margin-top: 6px"><sc-for list="{{bars}}" as="b" hint-placeholder-count="60"><div style="{{b.style}}"></div></sc-for></div>
<div style="display: flex; justify-content: space-between; margin-top: 6px; font-size: 10.5px; color: #8E9BB2; font-family: 'JetBrains Mono', monospace"><span>10 PM</span><span>2 AM</span><span>6 AM</span><span>8 AM</span></div>
<a href="MBug.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; margin-top: 16px; border-radius: 16px; background: {{accent}}; color: #03211D; font-size: 15px; font-weight: 800; box-shadow: 0 12px 36px -8px rgba(52,227,203,0.75)">Review fix PR #143</a>
</section>

<section style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><div style="font-size: 17px; font-weight: 800; letter-spacing: -0.3px">Needs you</div><a href="MBugs.dc.html" style="font-size: 13px; font-weight: 800; color: {{accent}}">All bugs</a></div>
<sc-for list="{{needs}}" as="n" hint-placeholder-count="2">
<a href="{{n.href}}" style="{{n.card}}"><div style="display: flex; justify-content: space-between; align-items: center"><span style="{{n.chip}}">{{n.sev}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #8E9BB2">{{n.ref}}</span></div><div style="font-size: 15px; font-weight: 700; margin-top: 10px; line-height: 1.3">{{n.title}}</div></a>
</sc-for>
</section>
</main>

<dc-import name="TabBar" active="Home" hint-size="100%,96px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#34E3CB","options":["#34E3CB","#6AA6FF","#8B7CFF","#FFC14D"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#34E3CB';
    const CORAL = '#FF6B5B', AMBER = '#FFC14D', BLUE = '#6AA6FF';
    const ev = [[1.2, BLUE], [42.3, CORAL], [47.3, accent], [56.7, AMBER], [98.5, '#EAF0FA']];
    const pins = ev.map(([at, c]) => ({ style: 'position:absolute;top:4px;left:' + at + '%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:' + c + ';box-shadow:0 0 12px ' + c + ',0 0 0 3px rgba(7,10,16,0.9)' }));
    const bars = [];
    for (let i = 0; i < 60; i++) {
      const base = 5 + 12 * Math.abs(Math.sin(i * 0.37) + 0.55 * Math.sin(i * 0.91));
      const near = ev.reduce((m, [at]) => Math.max(m, 1 - Math.min(1, Math.abs(i * (100 / 60) - at) / 6)), 0);
      bars.push({ style: 'flex:1;border-radius:2px 2px 0 0;background:' + accent + ';height:' + Math.round(Math.min(30, base + near * 14)) + 'px;opacity:' + (0.28 + near * 0.62).toFixed(2) });
    }
    const chip = (bg, fg) => 'font-size:11.5px;font-weight:800;color:' + fg + ';background:' + bg + ';padding:4px 10px;border-radius:99px';
    const base = 'display:block;padding:14px 16px;border-radius:18px;border:1px solid rgba(255,255,255,0.09);background:linear-gradient(180deg,rgba(255,255,255,0.055),rgba(255,255,255,0.016));box-shadow:inset 0 1px 0 rgba(255,255,255,0.07)';
    const needs = [
      { sev: 'Medium', ref: '#144', title: 'Profile photo upload fails on slow 3G', href: 'MBugs.dc.html', chip: chip('rgba(255,193,77,0.17)', AMBER), card: base },
      { sev: 'Setup', ref: 'Refund request', title: 'Test account is locked, flow could not start', href: 'MSetup.dc.html', chip: chip('rgba(139,124,255,0.2)', '#B9A6FF'), card: base }
    ];
    return { accent, pins, bars, needs };
  }
}
</script>
</body>
</html>
