<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NightQA Mobile bugs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; font-family: 'Manrope', system-ui, sans-serif; color: #EAF0FA; background: radial-gradient(420px 300px at 10% -60px, rgba(255,107,91,0.16), transparent 65%), radial-gradient(380px 300px at 100% 40%, rgba(52,227,203,0.10), transparent 65%), #070A10">

<header style="padding: 26px 20px 8px">
<div style="font-size: 11.5px; letter-spacing: 1.3px; text-transform: uppercase; font-weight: 800; color: {{accent}}">Bugs</div>
<h1 style="margin: 6px 0 0; font-size: 30px; font-weight: 800; letter-spacing: -1.1px">Proven bugs</h1>
</header>

<div style="display: flex; gap: 8px; padding: 10px 20px 14px; overflow-x: auto">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5"><span style="{{c.style}}">{{c.label}}</span></sc-for>
</div>

<main style="flex: 1; min-height: 0; padding: 0 20px; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{bugs}}" as="b" hint-placeholder-count="4">
<a href="MBug.dc.html" style="{{b.card}}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><span style="{{b.chip}}">{{b.sev}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #8E9BB2">{{b.ref}}</span></div>
<div style="font-size: 15.5px; font-weight: 700; margin-top: 10px; line-height: 1.3">{{b.title}}</div>
<div style="font-size: 12.5px; color: #A3AEC2; margin-top: 5px">{{b.meta}}</div>
</a>
</sc-for>
</main>

<dc-import name="TabBar" active="Bugs" hint-size="100%,96px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#34E3CB","options":["#34E3CB","#6AA6FF","#8B7CFF","#FFC14D"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#34E3CB';
    const CORAL = '#FF6B5B', AMBER = '#FFC14D';
    const chips = [['All', 8], ['Confirmed', 2], ['Needs a look', 2], ['Fix PR', 1], ['Merged', 3]].map(([label, n], i) => ({
      label: label + ' ' + n,
      style: 'flex:0 0 auto;display:inline-flex;align-items:center;min-height:44px;box-sizing:border-box;padding:0 16px;border-radius:99px;font-size:13px;font-weight:800;border:1px solid ' + (i === 0 ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.1)') + ';background:' + (i === 0 ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.03)') + ';color:' + (i === 0 ? '#FFFFFF' : '#A3AEC2')
    }));
    const chip = (bg, fg) => 'font-size:11.5px;font-weight:800;color:' + fg + ';background:' + bg + ';padding:4px 10px;border-radius:99px';
    const base = 'display:block;padding:15px 16px;border-radius:18px;border:1px solid rgba(255,255,255,0.09);background:linear-gradient(180deg,rgba(255,255,255,0.055),rgba(255,255,255,0.016));box-shadow:inset 0 1px 0 rgba(255,255,255,0.07)';
    const hot = 'display:block;padding:15px 16px;border-radius:18px;border:1px solid rgba(255,107,91,0.55);background:linear-gradient(180deg,rgba(255,107,91,0.14),rgba(255,107,91,0.03));box-shadow:0 0 40px -14px rgba(255,107,91,0.65),inset 0 1px 0 rgba(255,255,255,0.08)';
    const bugs = [
      { sev: 'High', ref: '#142 · PR #143', title: 'Expired coupon is accepted at checkout', meta: 'Fix PR ready · CI green · low risk', chip: chip('rgba(255,107,91,0.18)', '#FF8A7B'), card: hot },
      { sev: 'Medium', ref: '#144', title: 'Profile photo upload fails on slow 3G', meta: 'Found by the slow-network persona', chip: chip('rgba(255,193,77,0.17)', AMBER), card: base },
      { sev: 'Low', ref: '#145', title: 'Console error on the profile page', meta: 'No visible effect · no fix PR for Low', chip: chip('rgba(255,255,255,0.1)', '#C7D0E0'), card: base },
      { sev: 'Flaky', ref: '1 of 3', title: 'Order confirmation sometimes shows blank', meta: 'Needs a look · not sent to GitHub', chip: chip('rgba(139,124,255,0.2)', '#B9A6FF'), card: base }
    ];
    return { accent, chips, bugs };
  }
}
</script>
</body>
</html>
