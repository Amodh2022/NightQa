name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build, eval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nightqa_test
          POSTGRES_USER: nightqa
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nightqa -d nightqa_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NIGHTQA_TEST_DATABASE_URL: postgres://nightqa:ci-only@localhost:5432/nightqa_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm build
      # Keyless eval of the engine plumbing on the bug zoo. Fails if precision or recall drops below eval/baseline.scripted.json.
      - run: pnpm eval:pipeline

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: Dashboard (web/) lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image and compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose file
        run: docker compose config -q
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nightqa:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: CLI starts and the runtime user is not root
        run: |
          docker run --rm nightqa:local node dist/src/cli.js --help | head -3
          test "$(docker run --rm --entrypoint id nightqa:local -u)" != "0"
      - name: Dashboard is locked until sign-in is configured (fails closed)
        run: |
          docker compose up -d --wait --wait-timeout 120
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3300/api/runs)" = "503"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3300/)" = "307"
          curl -fsS http://localhost:3300/login | grep -q "Sign-in is not set up"
          curl -fsS http://localhost:4010/products > /dev/null
      - name: Dashboard serves data when sign-in is explicitly off
        run: |
          NIGHTQA_AUTH=off docker compose up -d --wait --wait-timeout 120 app
          curl -fsS http://localhost:3300/api/runs
      - name: Chromium launches inside the container and reaches the demo shop
        run: |
          docker compose run --rm --no-deps --entrypoint node app -e "import('playwright').then(async ({chromium}) => { const b = await chromium.launch(); const p = await b.newPage(); await p.goto('http://zoo:4010/products'); console.log(await p.title()); await b.close(); })"
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  # Real-model eval: needs your API key as a repository secret, so it only runs when asked.
  eval-real:
    name: Eval with the real model
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NIGHTQA_MODEL_STRONG: ${{ vars.NIGHTQA_MODEL_STRONG }}
          NIGHTQA_PRICE_STRONG_INPUT_PER_MTOK: ${{ vars.NIGHTQA_PRICE_STRONG_INPUT_PER_MTOK }}
          NIGHTQA_PRICE_STRONG_OUTPUT_PER_MTOK: ${{ vars.NIGHTQA_PRICE_STRONG_OUTPUT_PER_MTOK }}
